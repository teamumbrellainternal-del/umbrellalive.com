name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify build output
        run: |
          echo "Contents of repository:"
          ls -la
          echo ""
          echo "Checking for index.html..."
          if [ -f "index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html not found"
            exit 1
          fi
          echo ""
          echo "Checking for video files..."
          ls -lah *.webm *.mp4 *.mov 2>/dev/null || echo "No video files found"
          echo ""
          echo "Total size of deployable files:"
          du -sh . --exclude='.git' --exclude='old' --exclude='*.old'

      # Clean up files we don't want to deploy
      - name: Prepare deployment directory
        run: |
          rm -rf old
          rm -f *.old
          rm -rf .git .github .gitignore
          echo "Files to deploy:"
          ls -lah

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=umbrellalive --branch=main --commit-dirty=true
        env:
          WRANGLER_LOG: debug

      - name: Print deployment output
        if: always()
        run: |
          echo "=== Command Output ==="
          echo "${{ steps.deploy.outputs.command-output }}"
          echo ""
          echo "=== Command Stderr ==="
          echo "${{ steps.deploy.outputs.command-stderr }}"
          echo ""
          echo "=== Deployment URL ==="
          echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Add deployment summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Violet landing page has been deployed to Cloudflare Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Production URL:** https://www.umbrellalive.com" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Preview URL:** https://umbrellalive.pages.dev" >> $GITHUB_STEP_SUMMARY
